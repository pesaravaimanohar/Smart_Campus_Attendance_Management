spring.datasource.url=jdbc:h2:mem:smart_attendance;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

app.jwtSecret=TestJwtSecretKeyThatIsLongEnoughForHs512AndSafeForIntegration1234
app.jwtExpirationInMs=86400000
app.cors.allowed-origins=http://localhost:5173
app.seed.enabled=true
app.seed.ug-students-per-year=2
app.seed.pg-students-per-year=1
app.seed.mca-students-per-year=1
app.seed.sessions-per-mapping=1

file.upload-dir=build/test-uploads
