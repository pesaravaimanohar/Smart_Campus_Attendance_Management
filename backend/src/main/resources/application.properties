spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smart_attendance?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}


# JWT Configuration
app.jwtSecret=${APP_JWT_SECRET:ChangeThisJwtSecretBeforeProductionUse1234567890AndKeepItLongEnough1234}
app.jwtExpirationInMs=${APP_JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

# Seed demo/sample data on startup for local environments
app.seed.enabled=${APP_SEED_ENABLED:false}

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=${FILE_UPLOAD_DIR:uploads/profiles}
