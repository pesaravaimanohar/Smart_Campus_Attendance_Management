spring.datasource.url=${DB_URL:jdbc:postgresql://db.nfpczguepuqdkuswqpwp.supabase.co:5432/postgres?sslmode=require}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:SupaBase@Manohar}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Hikari Connection Pool Settings (optimized for Supabase 15 max connection limit)
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.max-lifetime=30000

server.port=${PORT:8080}


spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}


# JWT Configuration
app.jwtSecret=${APP_JWT_SECRET:ChangeThisJwtSecretBeforeProductionUse1234567890AndKeepItLongEnough1234}
app.jwtExpirationInMs=${APP_JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,https://smart-campus-attendance-management.vercel.app,https://*.vercel.app}

# Seed demo/sample data on startup for local environments
app.seed.enabled=${APP_SEED_ENABLED:false}

# Seeding counts
app.seed.ug-students-per-year=${APP_SEED_UG_STUDENTS:60}
app.seed.pg-students-per-year=${APP_SEED_PG_STUDENTS:10}
app.seed.mca-students-per-year=${APP_SEED_MCA_STUDENTS:20}
app.seed.sessions-per-mapping=${APP_SEED_SESSIONS_PER_MAPPING:35}

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=${FILE_UPLOAD_DIR:uploads/profiles}
